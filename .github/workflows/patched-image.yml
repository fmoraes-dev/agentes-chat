name: Patched image

# Fork-only build of the v0.1.18 patches: the published image, pinned by digest, plus the patched file.
# Lives only on the integration branch release/v0.1.18-fmoraes (v0.1.18 + each topic branch). Runs by hand from a
# release/** branch (Actions > Run workflow) and on a `v*-fmoraes.*` tag. Nothing else on this branch runs: the
# upstream workflows are deleted from it, so the tag cannot start a release, a signing job or a cloud call.
#
# 1. gate: the patched tree installs from the lockfile, every package typechecks (apps/web included, as upstream
#    does it) and the tests around the changed file pass.
# 2. image: the base file is checked against the v0.1.18 blob, the patched file is copied over it, and the result
#    is pushed to ghcr only if the gate passed. A version tag is written once: a rerun finds it and pushes nothing.
#
# A new patch version is a new commit that changes VERSION below, and a new tag of the same name.
on:
  workflow_dispatch:
  push:
    tags: ["v*-fmoraes.*"]

permissions:
  contents: read

concurrency:
  group: patched-image
  cancel-in-progress: false

env:
  VERSION: v0.1.18-fmoraes.2
  IMAGE: ghcr.io/fmoraes-dev/agentes
  BASE: ghcr.io/agentes-chat/agentes@sha256:a9cd9ebdaeb119356b57828dfd0ff5029c82f738ddfd52a20f728a195d3dffd3
  FILE: packages/engine/src/machine-accounts.ts
  # sha256 of FILE at v0.1.18 (what the base image holds) and of the patched FILE in this tree.
  BASE_SHA256: 979d5358151a7cb464801a0b2547ec951f9ff523e368d1efeac226784ae33d20
  PATCHED_SHA256: d664e05010d65b82ada0cd28a97b6f878b00904d398e650ac51a2301e10f1eae

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Gate (install, typecheck, tests)
    if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the version
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "$VERSION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Upstream's loop: one package at a time, each within 5 minutes, so a hang is named instead of timing out the job.
      - name: Typecheck every package
        run: |
          set +e
          status=0
          for dir in $(git ls-files '*/package.json' | xargs -n1 dirname | sort); do
            jq -e '.scripts.typecheck' "$dir/package.json" >/dev/null || continue
            start=$(date +%s)
            (cd "$dir" && timeout 300 bun run typecheck) > typecheck-one.log 2>&1
            code=$?
            cat typecheck-one.log
            echo "$dir: $(( $(date +%s) - start ))s, exit $code" | tee -a typecheck-times.log
            if [ "$code" -ne 0 ]; then
              echo "::error::Typecheck failed in $dir (exit $code; 124 = over 5 minutes)"
              status=1
            fi
          done
          { echo '### Typecheck per package'; echo '```'; cat typecheck-times.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # The new test, and every engine test that imports the patched file.
      - name: Account-order tests
        run: |
          bun test apps/server/test/account-order.test.ts \
            packages/engine/test/machine-accounts.test.ts packages/engine/test/plan-recheck.test.ts \
            packages/engine/test/brain-antigravity.test.ts packages/engine/test/brain-cursor.test.ts \
            packages/engine/test/brain-grok.test.ts packages/engine/test/brain-opencode.test.ts

  image:
    name: Overlay image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Files are the ones we expect
        run: |
          echo "$PATCHED_SHA256  $FILE" | sha256sum -c -
          # The base image's copy, per platform, read without running anything (no emulation needed).
          for p in amd64 arm64; do
            rm -rf "base-$p"
            docker buildx build --platform "linux/$p" --output "type=local,dest=base-$p" - <<EOF
          FROM $BASE AS base
          FROM scratch
          COPY --from=base /app/$FILE /file
          EOF
            echo "$BASE_SHA256  base-$p/file" | sha256sum -c -
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version tag is free
        id: free
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::notice::$IMAGE:$VERSION already exists; not rebuilt. Bump VERSION for a new patch."
            echo "free=false" >> "$GITHUB_OUTPUT"
          else
            echo "free=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dockerfile
        if: steps.free.outputs.free == 'true'
        run: |
          printf 'FROM %s\nCOPY %s /app/%s\n' "$BASE" "$FILE" "$FILE" > "$RUNNER_TEMP/Dockerfile"
          cat "$RUNNER_TEMP/Dockerfile"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: steps.free.outputs.free == 'true'
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=agentes (patched)
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=ghcr.io/agentes-chat/agentes
            org.opencontainers.image.base.digest=sha256:a9cd9ebdaeb119356b57828dfd0ff5029c82f738ddfd52a20f728a195d3dffd3
      - name: Digest
        if: steps.free.outputs.free == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Pushed $IMAGE:$VERSION@$DIGEST"
          { echo '### Pushed'; echo "\`$IMAGE:$VERSION@$DIGEST\`"; } >> "$GITHUB_STEP_SUMMARY"
